keys:
  - &eek age1n5378elj0f6pkyludtlqtnpjs2335wrwecsklmzgf838asyx7f6s74ym2r
  - &bender age1nalndumtuymsz4v8gnqtns9gfykzwprsy4tq2pgwamjzete5q9pq74v5f0
  - &ponkotsu age17h72ekfzrn6sd9ywpnt87du32tnrxy9r49yfydje554f4pvcs5us6azkcp
  - &mac age1xy95jk46rq64gg4jx47a00w62zhxn5dpfs3vrhh5t6gvpa4pu3dqjgakkc
  - &wall-e age1muxs363pzdyagcgdq5wqumv773rlffedg0wxw6nl4u59xuht8uzsjt25sm
  - &baymax age10tspkmr6fkjqegtuefp26qlxc74365cgqwfer6ac3szeemk6mpyqcl73lq

creation_rules:
  - path_regex: secrets/eek\.yaml
    key_groups:
      - age:
          - *eek
          - *bender
          - *ponkotsu
          - *mac
          - *wall-e
          - *baymax

  # MediaManager and slskd run on baymax alone, so their secrets are kept off
  # the other hosts. These rules precede the `services/` rule below because
  # sops takes the first match, and the generic rule does not list baymax.
  - path_regex: secrets/services/mediamanager\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *eek
          - *baymax

  - path_regex: secrets/services/slskd\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *eek
          - *baymax

  - path_regex: secrets/services/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *eek
          - *bender
          - *ponkotsu
          - *mac
          - *wall-e
